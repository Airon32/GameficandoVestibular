<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  
  <!-- App Background with Rounded Squircle Shape (Android Style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#292524" stroke-width="6"/>

  <!-- Glowing mathematical symbol background aura -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.12"/>

  <!-- Calculator / Math Frame Icon -->
  <g transform="translate(106, 106)">
    <!-- Plus symbol -->
    <rect x="40" y="70" width="60" height="18" rx="9" fill="url(#accentGrad)"/>
    <rect x="61" y="49" width="18" height="60" rx="9" fill="url(#accentGrad)"/>

    <!-- Minus symbol -->
    <rect x="200" y="70" width="60" height="18" rx="9" fill="#e2e8f0"/>

    <!-- Multiply symbol (X) -->
    <g transform="translate(70, 230) rotate(45)">
      <rect x="-30" y="-9" width="60" height="18" rx="9" fill="#e2e8f0"/>
      <rect x="-9" y="-30" width="18" height="60" rx="9" fill="#e2e8f0"/>
    </g>

    <!-- Division symbol -->
    <circle cx="230" cy="205" r="9" fill="url(#accentGrad)"/>
    <rect x="200" y="221" width="60" height="18" rx="9" fill="url(#accentGrad)"/>
    <circle cx="230" cy="255" r="9" fill="url(#accentGrad)"/>
  </g>
</svg>
